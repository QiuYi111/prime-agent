name: Reify Prime session E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reify-prime-session-e2e:
    name: Pinned cross-repository session test
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned Prime Agent test source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: QiuYi111/prime-agent
          ref: 0a6955ae046f73533b64731d9025ab560851a3ac
          path: prime
          persist-credentials: false

      - name: Checkout pinned Reify source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: QiuYi111/pi-cad
          ref: e0b453f90fe1a839f8cf1090ac18f46bf6057668
          path: reify
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd

      - name: Install Prime Agent dependencies
        working-directory: prime
        run: npm ci

      - name: Install Reify dependencies
        working-directory: reify
        run: npm ci --ignore-scripts

      - name: Install uv and Prime kernel dependencies
        run: |
          python3 -m pip install --user uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" sync --project prime/prime-agent-runtime --locked

      - name: Run the real cross-repository E2E
        env:
          PRIME_AGENT_KERNEL_PYTHON: ${{ github.workspace }}/prime/prime-agent-runtime/.venv/bin/python
        run: prime/scripts/test-reify-prime-session-e2e.sh "$GITHUB_WORKSPACE/reify"
